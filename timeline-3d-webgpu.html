<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline - Marxist Theory | 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #12131A;
            --text-primary: #ffffff;
            --text-muted: #9ca3af;
            --accent: #dc2626;
            --font-display: 'Playfair Display', Georgia, serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-mono);
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }

        #three-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-overlay {
            position: relative;
            z-index: 10;
            pointer-events: none;
        }

        .header {
            padding: 40px 48px 24px;
            background: linear-gradient(180deg, rgba(18,19,26,0.95) 0%, rgba(18,19,26,0) 100%);
        }

        .header-label {
            font-size: 10px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .header-title {
            font-family: var(--font-display);
            font-size: 42px;
            font-weight: 500;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .header-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 300;
        }

        .filter-bar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            pointer-events: auto;
        }

        .filter-inner {
            background: rgba(9, 9, 9, 0.8);
            backdrop-filter: blur(16px);
            border-radius: 12px;
            padding: 6px;
            display: flex;
            gap: 4px;
            border: 1px solid rgba(185, 28, 28, 0.2);
        }

        .filter-btn {
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 180ms ease;
            color: var(--text-muted);
            background: transparent;
            border: none;
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .filter-btn:hover { color: var(--text-primary); }
        .filter-btn.active {
            background: var(--accent);
            color: var(--text-primary);
            box-shadow: 0 0 20px rgba(220, 38, 38, 0.4);
        }

        .year-display {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 20;
        }

        .current-year {
            font-family: var(--font-display);
            font-size: 72px;
            font-weight: 500;
            color: var(--accent);
            text-shadow: 0 0 40px rgba(220, 38, 38, 0.6);
            letter-spacing: -0.02em;
        }

        .current-title {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .progress-container {
            position: fixed;
            bottom: 20px;
            left: 48px;
            right: 48px;
            z-index: 20;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #ff6b6b);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-text {
            font-size: 12px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent);
            margin-top: 20px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 2px solid rgba(220, 38, 38, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loadingText">Loading 3D Engine</div>
    </div>

    <canvas id="three-canvas"></canvas>

    <div class="ui-overlay">
        <header class="header">
            <div class="header-label">Historical Timeline</div>
            <h1 class="header-title">Chronicle of Revolutionary Thought</h1>
            <p class="header-subtitle">Scroll or drag to navigate through history</p>
        </header>

        <div class="filter-bar">
            <div class="filter-inner">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="biography">Biography</button>
                <button class="filter-btn" data-filter="publication">Publication</button>
                <button class="filter-btn" data-filter="revolution">Revolution</button>
            </div>
        </div>

        <div class="year-display">
            <div class="current-year" id="currentYear">1818</div>
            <div class="current-title" id="currentTitle">Karl Marx Born</div>
        </div>

        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 16.67%"></div>
            </div>
        </div>
    </div>

    <!-- Three.js from CDN -->
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/shaders/CopyShader.js"></script>

    <script>
        // Timeline Data
        const timelineEvents = [
            { id: 1, year: 1818, title: "Karl Marx Born", description: "Karl Heinrich Marx was born in Trier, Prussia", category: "biography", color: 0xdc2626 },
            { id: 2, year: 1848, title: "The Communist Manifesto", description: "Marx and Engels published the Communist Manifesto", category: "publication", color: 0xef4444 },
            { id: 3, year: 1867, title: "Das Kapital Volume I", description: "Marx published Das Kapital, his magnum opus", category: "publication", color: 0xf97316 },
            { id: 4, year: 1883, title: "Death of Karl Marx", description: "Karl Marx died in London at age 64", category: "biography", color: 0xdc2626 },
            { id: 5, year: 1917, title: "Russian October Revolution", description: "The Bolsheviks seized power in Russia", category: "revolution", color: 0xfbbf24 },
            { id: 6, year: 1949, title: "People's Republic of China", description: "Mao proclaimed the People's Republic of China", category: "revolution", color: 0xdc2626 }
        ];

        // State
        let scene, camera, renderer, composer;
        let cards = [];
        let particles;
        let currentIndex = 0;
        let targetScrollX = 0;
        let scrollX = 0;
        let mouseX = 0, mouseY = 0;
        let isDragging = false;
        let dragStartX = 0;
        let scrollStartX = 0;
        let initialized = false;

        // DOM
        const canvas = document.getElementById('three-canvas');
        const loadingEl = document.getElementById('loading');
        const loadingText = document.getElementById('loadingText');
        const currentYearEl = document.getElementById('currentYear');
        const currentTitleEl = document.getElementById('currentTitle');
        const progressFill = document.getElementById('progressFill');
        const filterBtns = document.querySelectorAll('.filter-btn');

        // Check Three.js loaded
        function checkThreeLoaded() {
            return typeof THREE !== 'undefined' && 
                   typeof THREE.WebGLRenderer === 'function';
        }

        function init() {
            if (initialized) return;
            initialized = true;

            loadingText.textContent = 'Initializing 3D Scene';

            try {
                // Renderer
                renderer = new THREE.WebGLRenderer({
                    canvas,
                    antialias: true,
                    alpha: true,
                    powerPreference: 'high-performance'
                });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.outputColorSpace = THREE.SRGBColorSpace;
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                renderer.toneMappingExposure = 1.2;

                // Scene
                scene = new THREE.Scene();
                scene.fog = new THREE.FogExp2(0x12131A, 0.02);

                // Camera
                camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 2, 12);
                camera.lookAt(0, 0, 0);

                // Post-processing with bloom
                if (typeof EffectComposer !== 'undefined') {
                    composer = new EffectComposer(renderer);
                    composer.addPass(new RenderPass(scene, camera));
                    
                    if (typeof UnrealBloomPass !== 'undefined') {
                        const bloomPass = new UnrealBloomPass(
                            new THREE.Vector2(window.innerWidth, window.innerHeight),
                            0.6, 0.4, 0.85
                        );
                        composer.addPass(bloomPass);
                    }
                }

                // Create scene
                createBackground();
                createParticles();
                createSpine();
                createTimelineCards();
                createLighting();

                // Events
                setupEventListeners();

                // Hide loading
                loadingEl.classList.add('hidden');

                // Animation
                animate();

            } catch (error) {
                console.error('3D initialization failed:', error);
                loadingText.textContent = 'Error: ' + error.message;
            }
        }

        function createBackground() {
            // Animated grid
            const gridGeo = new THREE.PlaneGeometry(200, 200, 80, 80);
            const gridMat = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uColor: { value: new THREE.Color(0xdc2626) },
                    uScrollX: { value: 0 }
                },
                vertexShader: `
                    varying vec2 vUv;
                    varying vec3 vPos;
                    void main() {
                        vUv = uv;
                        vPos = position;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float uTime;
                    uniform vec3 uColor;
                    uniform float uScrollX;
                    varying vec2 vUv;
                    varying vec3 vPos;
                    void main() {
                        vec2 uv = vUv;
                        uv.x = fract(uv.x * 30.0 + uScrollX * 0.02);
                        uv.y = fract(uv.y * 30.0);
                        
                        float grid = step(0.95, uv.x) + step(0.95, uv.y);
                        grid = min(grid, 1.0);
                        
                        float dist = length(vPos.xy) * 0.01;
                        float fade = 1.0 - smoothstep(0.0, 1.0, dist);
                        
                        float pulse = sin(uTime * 1.5 - vPos.x * 0.1) * 0.5 + 0.5;
                        
                        vec3 color = uColor * grid * fade * (0.4 + pulse * 0.2);
                        float alpha = grid * fade * 0.7;
                        
                        gl_FragColor = vec4(color, alpha);
                    }
                `,
                transparent: true,
                side: THREE.DoubleSide
            });

            const grid = new THREE.Mesh(gridGeo, gridMat);
            grid.rotation.x = -Math.PI / 2;
            grid.position.y = -3;
            scene.add(grid);
            scene.userData.gridMaterial = gridMat;
        }

        function createParticles() {
            const count = 1500;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 150;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 50;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 80 - 20;

                colors[i * 3] = 0.86 + Math.random() * 0.14;
                colors[i * 3 + 1] = 0.15 + Math.random() * 0.2;
                colors[i * 3 + 2] = 0.15 + Math.random() * 0.2;
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                size: 2,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particles = new THREE.Points(geo, mat);
            scene.add(particles);
        }

        function createSpine() {
            const length = timelineEvents.length * 12;

            // Main line
            const geo = new THREE.CylinderGeometry(0.03, 0.03, length, 8);
            const mat = new THREE.MeshBasicMaterial({ color: 0xdc2626, transparent: true, opacity: 0.9 });
            const spine = new THREE.Mesh(geo, mat);
            spine.rotation.z = Math.PI / 2;
            spine.position.x = (timelineEvents.length - 1) * 6;
            scene.add(spine);

            // Glow
            const glowGeo = new THREE.CylinderGeometry(0.15, 0.15, length, 8);
            const glowMat = new THREE.MeshBasicMaterial({ color: 0xdc2626, transparent: true, opacity: 0.1 });
            const glow = new THREE.Mesh(glowGeo, glowMat);
            glow.rotation.z = Math.PI / 2;
            glow.position.x = (timelineEvents.length - 1) * 6;
            scene.add(glow);

            // Year markers
            timelineEvents.forEach((event, i) => {
                const markerGeo = new THREE.TorusGeometry(0.4, 0.08, 16, 32);
                const markerMat = new THREE.MeshBasicMaterial({ color: event.color, transparent: true, opacity: 0.8 });
                const marker = new THREE.Mesh(markerGeo, markerMat);
                marker.position.set(i * 12, -2.5, 0);
                marker.rotation.x = -Math.PI / 2;
                scene.add(marker);
            });
        }

        function createTimelineCards() {
            timelineEvents.forEach((event, i) => {
                const group = new THREE.Group();

                // Card base with rounded edges effect
                const cardGeo = new THREE.BoxGeometry(4, 2.5, 0.15);
                const cardMat = new THREE.MeshStandardMaterial({
                    color: 0x1a1a2e,
                    metalness: 0.4,
                    roughness: 0.6,
                    emissive: new THREE.Color(event.color),
                    emissiveIntensity: 0.15
                });
                const card = new THREE.Mesh(cardGeo, cardMat);
                group.add(card);

                // Border glow
                const borderGeo = new THREE.BoxGeometry(4.1, 2.6, 0.1);
                const borderMat = new THREE.MeshBasicMaterial({
                    color: event.color,
                    transparent: true,
                    opacity: 0.4
                });
                const border = new THREE.Mesh(borderGeo, borderMat);
                group.add(border);

                // Year text using sprite
                const yearSprite = createTextSprite(event.year.toString(), {
                    fontSize: 64,
                    color: '#dc2626',
                    fontFamily: 'JetBrains Mono, monospace'
                });
                yearSprite.position.set(0, 0.8, 0.1);
                group.add(yearSprite);

                // Title text
                const titleSprite = createTextSprite(event.title, {
                    fontSize: 32,
                    color: '#ffffff',
                    fontFamily: 'Playfair Display, serif',
                    maxWidth: 360
                });
                titleSprite.position.set(0, 0.2, 0.1);
                group.add(titleSprite);

                // Category badge
                const catSprite = createTextSprite(event.category.toUpperCase(), {
                    fontSize: 18,
                    color: '#dc2626',
                    fontFamily: 'JetBrains Mono, monospace',
                    backgroundColor: 'rgba(220, 38, 38, 0.2)',
                    padding: 10
                });
                catSprite.position.set(0, -0.9, 0.1);
                group.add(catSprite);

                // Position
                group.position.set(i * 12, 0, 0);
                group.userData = { event, index: i };

                // Connector line to spine
                const lineGeo = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(0, -1.4, 0),
                    new THREE.Vector3(0, -2.2, 0)
                ]);
                const lineMat = new THREE.LineBasicMaterial({ color: event.color, transparent: true, opacity: 0.5 });
                const line = new THREE.Line(lineGeo, lineMat);
                group.add(line);

                scene.add(group);
                cards.push(group);
            });
        }

        function createTextSprite(text, options = {}) {
            const {
                fontSize = 32,
                color = '#ffffff',
                fontFamily = 'Arial, sans-serif',
                backgroundColor = null,
                padding = 0,
                maxWidth = null
            } = options;

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = 512;
            canvas.height = 128;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Background
            if (backgroundColor) {
                ctx.fillStyle = backgroundColor;
                const radius = 20;
                ctx.beginPath();
                ctx.roundRect(128, 32, 256, 64, radius);
                ctx.fill();
            }

            // Text
            ctx.fillStyle = color;
            ctx.font = `bold ${fontSize}px ${fontFamily}`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Wrap text if needed
            if (maxWidth && ctx.measureText(text).width > maxWidth) {
                const words = text.split(' ');
                let line1 = '';
                let line2 = '';
                
                for (const word of words) {
                    const testLine = line1 + word + ' ';
                    if (ctx.measureText(testLine).width > maxWidth && line1) {
line2 = word;
                    } else if (!line2) {
                        line1 = testLine;
                    } else {
                        line2 += ' ' + word;
                    }
                }
                
                ctx.fillText(line1.trim(), 256, 54);
                ctx.fillText(line2.trim(), 256, 84);
            } else {
                ctx.fillText(text, 256, 64);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            
            const mat = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(3, 0.75, 1);

            return sprite;
        }

        function createLighting() {
            // Ambient
            scene.add(new THREE.AmbientLight(0xffffff, 0.4));

            // Main accent
            const redLight = new THREE.PointLight(0xdc2626, 3, 50);
            redLight.position.set(0, 5, 8);
            scene.add(redLight);

            // Per-card lights
            timelineEvents.forEach((event, i) => {
                const light = new THREE.PointLight(event.color, 1.5, 20);
                light.position.set(i * 12, 3, 4);
                scene.add(light);
            });
        }

        function setupEventListeners() {
            // Mouse parallax
            window.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX / window.innerWidth) * 2 - 1;
                mouseY = (e.clientY / window.innerHeight) * 2 - 1;
            });

            // Drag
            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                dragStartX = e.clientX;
                scrollStartX = targetScrollX;
                canvas.style.cursor = 'grabbing';
            });

            window.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const delta = (dragStartX - e.clientX) * 0.015;
                    targetScrollX = Math.max(0, Math.min((timelineEvents.length - 1) * 12, scrollStartX + delta));
                }
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
                canvas.style.cursor = 'grab';
            });

            // Scroll
            window.addEventListener('wheel', (e) => {
                e.preventDefault();
                targetScrollX += e.deltaY * 0.008;
                targetScrollX = Math.max(0, Math.min((timelineEvents.length - 1) * 12, targetScrollX));
            }, { passive: false });

            // Touch
            let touchStartX = 0;
            let touchStartScroll = 0;
            
            canvas.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartScroll = targetScrollX;
            });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const delta = (touchStartX - e.touches[0].clientX) * 0.02;
                targetScrollX = Math.max(0, Math.min((timelineEvents.length - 1) * 12, touchStartScroll + delta));
            }, { passive: false });

            // Keyboard
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight' || e.key === 'd') {
                    targetScrollX = Math.min((timelineEvents.length - 1) * 12, targetScrollX + 12);
                } else if (e.key === 'ArrowLeft' || e.key === 'a') {
                    targetScrollX = Math.max(0, targetScrollX - 12);
                }
            });

            // Filter
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    filterCards(btn.dataset.filter);
                });
            });

            // Resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                if (composer) composer.setSize(window.innerWidth, window.innerHeight);
            });

            canvas.style.cursor = 'grab';
        }

        function filterCards(filter) {
            cards.forEach(card => {
                const event = card.userData.event;
                const visible = filter === 'all' || event.category === filter;
                card.traverse(child => {
                    if (child.material) {
                        child.material.transparent = true;
                        child.material.opacity = visible ? 1 : 0.15;
                    }
                });
            });
        }

        function updateUI() {
            let closest = 0;
            let minDist = Infinity;

            cards.forEach((card, i) => {
                const dist = Math.abs(card.position.x - scrollX);
                if (dist < minDist) {
                    minDist = dist;
                    closest = i;
                }
            });

            if (closest !== currentIndex) {
                currentIndex = closest;
                const event = timelineEvents[currentIndex];
                currentYearEl.textContent = event.year;
                currentTitleEl.textContent = event.title;
                progressFill.style.width = `${((currentIndex + 1) / timelineEvents.length) * 100}%`;
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now() * 0.001;

            // Smooth scroll
            scrollX += (targetScrollX - scrollX) * 0.1;

            // Camera
            camera.position.x = scrollX * 0.7;
            camera.position.y = 2 + mouseY * 0.5;
            camera.position.z = 14 + mouseX * 0.3;
            camera.lookAt(scrollX * 0.5, 0, 0);

            // Cards
            cards.forEach((card, i) => {
                const dist = Math.abs(card.position.x - scrollX);
                const normalized = dist / 15;

                // Float
                card.position.y = Math.sin(time * 1.5 + i * 0.8) * 0.25;
                
                // Scale
                const scale = Math.max(0.6, 1 - normalized * 0.2);
                card.scale.setScalar(scale);

                // Glow
                card.traverse(child => {
                    if (child.material && child.material.emissiveIntensity !== undefined) {
                        child.material.emissiveIntensity = Math.max(0.05, 0.2 - normalized * 0.15);
                    }
                });
            });

            // Particles
            if (particles) {
                particles.rotation.y = time * 0.03;
            }

            // Grid
            if (scene.userData.gridMaterial) {
                scene.userData.gridMaterial.uniforms.uTime.value = time;
                scene.userData.gridMaterial.uniforms.uScrollX.value = scrollX;
            }

            if (composer) {
                composer.render();
            } else {
                renderer.render(scene, camera);
            }

            updateUI();
        }

        // Start initialization
        function startup() {
            loadingText.textContent = 'Checking 3D Engine...';
            
            if (checkThreeLoaded()) {
                setTimeout(init, 100);
            } else {
                loadingText.textContent = 'Loading dependencies...';
                // Wait for scripts
                const checkInterval = setInterval(() => {
                    if (checkThreeLoaded()) {
                        clearInterval(checkInterval);
                        setTimeout(init, 100);
                    }
                }, 100);
                
                // Timeout after 10s
                setTimeout(() => {
                    clearInterval(checkInterval);
                    if (!initialized) {
                        loadingText.textContent = 'Failed to load 3D engine';
                    }
                }, 10000);
            }
        }

        startup();
    </script>
</body>
</html>
